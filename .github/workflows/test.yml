name: Build and Release Binaries

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target_name: webdav-gui-linux-x64
          - os: windows-latest
            target_name: webdav-gui-win-x64.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller wsgidav cheroot jaraco.functools more-itertools jinja2 markupsafe defusedxml pyyaml

      - name: Compile Standalone Binary
        run: |
          pyinstaller --noconsole --onefile --collect-all wsgidav --name ${{ matrix.target_name }} base.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target_name }}
          path: dist/${{ matrix.target_name }}

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Generate Auto Version Tag
        id: version
        run: |
          DATE_TAG=$(date +'%Y.%m.%d')
          RUN_NUM=${{ github.run_number }}
          VERSION="v${DATE_TAG}.${RUN_NUM}"
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "WebDAV GUI ${{ steps.version.outputs.tag }}"
          body: "Automated multi-platform standalone WebDAV server builds (Linux x64 & Windows x64) compiled via GitHub Actions."
          files: |
            all-artifacts/binary-webdav-gui-linux-x64/webdav-gui-linux-x64
            all-artifacts/binary-webdav-gui-win-x64.exe/webdav-gui-win-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
